name: Build & Tests

on:
  push:
    branches: [ 2.x, master, explicit-build-selection ]
  pull_request:
    branches: [ 2.x, master, explicit-build-selection ]

jobs:
  build:
    name: Build and Test Sparkle
    runs-on: xcode-27

    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Check Installer Progress localizations are up to date
        run: |
          python3 Configurations/generate_progress_tool_localizations.py
          if [ -n "$(git status --porcelain -- Sparkle/InstallerProgress/SPUInstallerProgressLocalizedStrings.h Sparkle/InstallerProgress/InstallerProgress-Info.plist)" ]; then
            echo "::error::Sparkle/InstallerProgress/SPUInstallerProgressLocalizedStrings.h or InstallerProgress-Info.plist is out of date. Run Configurations/generate_progress_tool_localizations.py and commit the result."
            git diff -- Sparkle/InstallerProgress/SPUInstallerProgressLocalizedStrings.h Sparkle/InstallerProgress/InstallerProgress-Info.plist
            exit 1
          fi
      - name: Build Unit Tests
        run: |
          xcodebuild build-for-testing -project Sparkle.xcodeproj -scheme Distribution -enableCodeCoverage YES -derivedDataPath build
      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building -project Sparkle.xcodeproj -scheme Distribution -enableCodeCoverage YES -derivedDataPath build
      - name: Build UI Tests
        run: |
          xcodebuild build-for-testing -project Sparkle.xcodeproj -scheme UITests -configuration Debug -derivedDataPath build
      - name: Run UI Tests
        run: |
          xcodebuild test-without-building -project Sparkle.xcodeproj -scheme UITests -configuration Debug -derivedDataPath build

      - name: Analyze Sparkle
        if: ${{ github.event_name == 'pull_request' }}
        run: |
            xcodebuild analyze -project Sparkle.xcodeproj -quiet -scheme Sparkle -configuration Release -derivedDataPath analyze > analyze_output.txt
            
      - name: Find Analyzed Warnings
        if: ${{ success() && github.event_name == 'pull_request' }}
        id: findwarnings
        run: |
            if grep -q "warning:" analyze_output.txt; then
                echo "analyzestatus=0" >> $GITHUB_OUTPUT
            else
                echo "analyzestatus=1" >> $GITHUB_OUTPUT
            fi
        
      - name: Extract Analyzed Warnings
        if: ${{ success() && github.event_name == 'pull_request' && steps.findwarnings.outputs.analyzestatus == '0' }}
        id: warnings
        run: |
            {
                echo 'content<<EOF'
                cat analyze_output.txt
                echo 'EOF'
            } >> $GITHUB_OUTPUT
      
      - name: Post Analyzed Warnings
        if: ${{ success() && github.event_name == 'pull_request' && steps.findwarnings.outputs.analyzestatus == '0' }}
        uses: mshick/add-pr-comment@v2
        with:
            allow-repeats: false
            message: "``` ${{ steps.warnings.outputs.content }} ```"
        
      - name: Build Release Distribution
        run: |
          xcodebuild build -project Sparkle.xcodeproj -scheme Distribution -configuration Release -derivedDataPath build
      - name: Archive Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            build/Logs
            ~/Library/Logs/DiagnosticReports
      - name: Upload Distribution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Sparkle-distribution-xcode27.tar.xz
          path: build/Build/Products/Release/sparkle_dist.tar.xz
